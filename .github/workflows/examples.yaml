name: Run examples

on:
  push:
    branches:
      - v6
  pull_request:
    paths:
      - "example/**"

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - "basic"
          - "batch"
          - "rbac"
    env:
      WEAVIATE_HOST: ${{ secrets.WCD_EXAMPLE_HOST }}
      WEAVIATE_API_KEY: ${{ secrets.WCD_EXAMPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: example/${{ matrix.example }}
        working-directory: ./example
        run: go run ./${{ matrix.example }}
