name: Fetch latest OpenAPI schema

on:
  push:
    branches:
      - main

jobs:
  check:
    name: contracts --check
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.26.10"
          cache: true
      - run: go run ./cmd/build contracts --check || true
